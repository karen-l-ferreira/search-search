<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Buscar Contato</title>
<style>
  body { font-family: Arial, sans-serif; background: #f5f6f8; padding: 40px; }
  .card { max-width: 480px; margin: 0 auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 1px 4px rgba(0,0,0,0.1); }
  h2 { margin-top: 0; color: #193469; }
  label { font-weight: bold; display: block; margin-bottom: 8px; }
  input[type="text"] { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; margin-bottom: 20px; }
  button { width: 100%; padding: 12px; font-size: 16px; background: #f4633a; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #d94f28; }
</style>
</head>
<body>
  <div class="card">
    <h2>Buscar Contato</h2>
    <p>Digite o CNPJ para consultar Lemit, Receita Federal e ActiveCampaign.</p>
    <form action="/api/buscar" method="POST">
      <label for="documento">CNPJ</label>
      <input type="text" id="documento" name="documento" placeholder="00.000.000/0000-00" required>
      <button type="submit">Buscar</button>
    </form>
  </div>
</body>
</html>
